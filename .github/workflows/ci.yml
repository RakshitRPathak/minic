name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    # The README states the suite is clean under AddressSanitizer and UndefinedBehaviorSanitizer; keep it that way.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build && g++ -std=c++17 -g -fsanitize=address,undefined src/main.cpp -o build/minic_san
      - run: tests/run_tests.sh build/minic_san
